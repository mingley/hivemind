- id: gold-09-resolution
  kind: decision
  scope: project:acme/cache-it
  statement: 'Canonical requirement: CI and docs must use Redis >=7.0; Redis 6 claim
    retracted after SMISMEMBER discriminating check.'
  about:
  - repo:acme/cache-it
  - pkg:redis
  when: {}
  fields:
