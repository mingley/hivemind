[package]
name = "hivemind-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
crc32c = "0.6.9"
hivemind-core = { version = "0.1.0", path = "../hivemind-core" }
memmap2 = "0.9"
parking_lot = "0.12.5"
rustix = { version = "1.1", features = ["fs"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
