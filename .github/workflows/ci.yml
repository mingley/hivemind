name: ci

# PR/main gates: workspace fmt, clippy -D warnings, tests.
# Release packaging lives in release.yml (main/tags) so PRs stay fast.
# protoc is required to build the gRPC stubs in crates/hivemind.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install protobuf
          else
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          fi
          protoc --version
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: Capacity budget (Linux; replay only)
        if: runner.os == 'Linux'
        run: cargo run --release --locked -p hivemind-engine --example rss_harness -- --seed-log --max-rss-mb 512 100000
      - name: 1,000-cycle crash soak (Linux)
        if: runner.os == 'Linux'
        env:
          HIVEMIND_CRASH_CYCLES: 1000
        run: cargo test --release --locked -p hivemind --test crash

  power-loss:
    name: power loss (LazyFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install FUSE and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libfuse3-dev fuse3
      - name: Build pinned LazyFS
        run: |
          git clone https://github.com/dsrhaslab/lazyfs.git "$RUNNER_TEMP/lazyfs"
          git -C "$RUNNER_TEMP/lazyfs" checkout 3edad01aa936b81fed9bd64e47e725fc5ef6c977
          cmake -S "$RUNNER_TEMP/lazyfs/libs/libpcache" -B "$RUNNER_TEMP/lazyfs/libs/libpcache/build"
          cmake --build "$RUNNER_TEMP/lazyfs/libs/libpcache/build" -j 2
          cmake -S "$RUNNER_TEMP/lazyfs/lazyfs" -B "$RUNNER_TEMP/lazyfs/lazyfs/build" -DLAZYFS_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/lazyfs/lazyfs/build" -j 2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Drop unsynced data and verify acknowledged writes
        env:
          LAZYFS_SOURCE: ${{ runner.temp }}/lazyfs
        run: ./scripts/power_loss.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lazyfs-test-log
          path: lazyfs-test.log
          if-no-files-found: ignore
